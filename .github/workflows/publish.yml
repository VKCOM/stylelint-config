name: 'Publish'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version (without v)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEVTOOLS_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: |
          npm install --global corepack
          corepack enable

      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: Install npm with OIDC support
        run: npm install --global npm@11

      - run: yarn install --immutable

      - run: yarn build

      - name: Set Git credentials
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"

      - name: Set release version
        run: |
          yarn version "$RELEASE_VERSION"
          git add package.json yarn.lock
          git -c core.hooksPath=/dev/null commit -m "v$RELEASE_VERSION"
          git -c core.hooksPath=/dev/null tag -am "v$RELEASE_VERSION" "v$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}

      - name: Pushing changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.DEVTOOLS_GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Publish release
        run: npm publish --access public
